// ============================================================
//  ПОЛЮС-11 RP — конфиг сервера
//  Кинуть в: garrysmod/cfg/server.cfg
// ============================================================

hostname "[RU] ПОЛЮС-11 | The Thing RP Military Horror | ЗАТ"
// v5.8.29: гейммод переименован polus -> darkrp (папка garrysmod/gamemodes/darkrp/).
// В сервер-браузере и в списке гейммодов сервер теперь виден как DarkRP.
// ВАЖНО: настоящий DarkRP рядом ставить НЕЛЬЗЯ — две папки darkrp конфликтуют.
gamemode darkrp

// ПАРОЛЯ НЕТ (v3.8.1 — по просьбе владельца): вход свободный.
// Чтобы снова закрыть сервер, впиши: sv_password "твой-пароль"
sv_password ""

// игроки/сеть
sv_lan 0
sv_cheats 0
sv_timeout 65
sv_allowupload 0
sv_allowdownload 1
sv_allowcslua 0
net_maxfilesize 64

// физика/мир
sv_gravity 600
phys_timescale 1

// голос/чат
sv_voiceenable 1
sv_alltalk 0
sv_deadtalk 1

// ============================================================
//  Sandbox-переменные. Лимиты и права спавна реально контролирует
//  гейммод (вайтлист пропов + PlayerCheckLimit: админам без потолка,
//  игрокам только пропы, макс 8), значения ниже — страховка.
// ============================================================
sbox_weapons 0
sbox_noclip 0
sbox_godmode 0
sbox_playershurtplayers 1
sbox_maxprops 0
sbox_maxragdolls 0
sbox_maxnpcs 0
sbox_maxsents 0
sbox_maxvehicles 0
sbox_maxeffects 0
sbox_maxballoons 0
sbox_maxlamps 0
sbox_maxbuttons 0
sbox_maxdynamite 0
sbox_maxhoverballs 0
sbox_maxthrusters 0
sbox_maxwheels 0
sbox_maxemitters 0
sbox_bonemanip_misc 0
sbox_bonemanip_npc 0
sbox_bonemanip_player 0
sbox_persist 0

// rcon пароль задай свой:
// rcon_password "СМЕНИ_МЕНЯ"

// карта стартует из командной строки: +map gm_flatgrass
// макс игроков из командной строки: -maxplayers 24
